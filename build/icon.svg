<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Circulation Builder</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34447a"/>
      <stop offset="1" stop-color="#121830"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#efe8d8"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6cf74"/>
      <stop offset=".5" stop-color="#d9a233"/>
      <stop offset="1" stop-color="#93600d"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4bdac"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <filter id="penShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-8" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <g transform="rotate(-8 470 512)">
    <path d="M 268 186 H 610 L 706 282 V 810 A 30 30 0 0 1 676 840 H 268 A 30 30 0 0 1 238 810 V 216 A 30 30 0 0 1 268 186 Z" fill="url(#paper)" filter="url(#paperShadow)"/>
    <path d="M 610 186 L 706 282 H 636 A 26 26 0 0 1 610 256 Z" fill="#d8cfba"/>

    <rect x="300" y="266" width="240" height="54" rx="27" fill="#1c2545"/>

    <circle cx="338" cy="426" r="40" fill="#b87a12"/>
    <rect x="404" y="390" width="250" height="72" rx="36" fill="#283158"/>
    <circle cx="338" cy="566" r="40" fill="#b87a12"/>
    <rect x="404" y="530" width="140" height="72" rx="36" fill="#283158"/>

    <path d="M 306 708 H 388" fill="none" stroke="#1c2545" stroke-width="34" stroke-linecap="round"/>
  </g>

  <g transform="translate(476 706) rotate(45)" filter="url(#penShadow)">
    <path d="M -48 -214 L -38 -560 A 38 38 0 0 1 38 -560 L 48 -214 Z" fill="url(#brass)"/>
    <path d="M -24 -236 L -17 -552" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="10" stroke-linecap="round"/>
    <rect x="-48" y="-216" width="96" height="62" fill="#1c2545"/>
    <path d="M 0 0 L -48 -140 L -48 -156 H 48 L 48 -140 Z" fill="url(#nib)" stroke="#1c2545" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 0 -26 L 0 -104" stroke="#1c2545" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
